spring:
  application:
    name: paiagent-one
  datasource:
    url: jdbc:h2:mem:paiagent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY:sk-placeholder}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-3.5-turbo}
